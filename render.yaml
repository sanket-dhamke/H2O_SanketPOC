# Render Blueprint for GATEZO. This one service is the stable public address:
# the API lives at /api and the browser app is the exported site in server/public.
# Rebuild the site from the repo root before deploying a UI change:
#   cd app && env -u EXPO_PUBLIC_API_URL npx expo export --platform web --output-dir ../server/public
# In Render: New + -> Blueprint -> connect this repo. Render reads this file.
# Set the "sync: false" secrets in the dashboard after the service is created.
services:
  - type: web
    name: h2o-api
    runtime: node
    rootDir: server
    plan: free
    # Render injects PORT; the server already binds to it on 0.0.0.0.
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Encrypts emails, phone numbers and payment details in Postgres.
      # Passwords stay a bcrypt hash. Set a long random value in the dashboard
      # and keep a copy — the server cannot read sealed rows without it.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # Supabase Postgres connection string (Session pooler / direct, port 5432).
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # AI (Groq / OpenAI-compatible). Optional but already working locally.
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_TRANSCRIBE_MODEL
        sync: false
      # Optional Supabase Storage for visitor photos.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      # Phone sign-in codes. The code is texted to the saved mobile and is never
      # returned to the app. Set one sender in the Render dashboard.
      # Twilio SMS: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM
      # Exotel SMS: EXOTEL_SID, EXOTEL_TOKEN, EXOTEL_FROM
      # WhatsApp: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, and an approved
      # template with one body variable, named in WHATSAPP_OTP_TEMPLATE.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_TOKEN
        sync: false
      - key: EXOTEL_FROM
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
